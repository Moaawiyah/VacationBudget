# Compose only auto-loads a file literally named `.env` for ${VAR} substitution
# below, but this project's convention is `.env.local` — so run this with:
#   docker compose --env-file .env.local up --build
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Overrides .env.local's RECEIPT_SERVICE_URL (usually localhost, which
      # doesn't resolve between containers) with compose's own DNS name.
      RECEIPT_SERVICE_URL: http://receipt-service:8000
    depends_on:
      receipt-service:
        condition: service_healthy
    restart: unless-stopped

  receipt-service:
    # paddlepaddle ships no linux/arm64 wheels, so on Apple Silicon this must
    # build and run as amd64 under emulation (Railway is amd64 natively).
    platform: linux/amd64
    build:
      context: ./receipt-service
    env_file:
      - receipt-service/.env
    # python:3.12-slim ships no curl/wget, so probe /health with the stdlib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
