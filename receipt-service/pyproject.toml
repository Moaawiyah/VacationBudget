[project]
name = "receipt-service"
version = "0.1.0"
description = "Receipt Intelligence pipeline: upload -> vision -> OCR -> LLM extraction -> validation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pillow>=11.0",
  "pillow-heif>=0.18",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "paddleocr>=2.9",
  "paddlepaddle>=2.6",
  "pytesseract>=0.3.13",
  "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 92
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Form()/Header() are designed to be used as
# argument defaults — that's the framework's own dependency-injection idiom,
# not the mutable-default-argument bug this rule normally catches.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
